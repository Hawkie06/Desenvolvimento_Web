<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table, th, td{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <caption>Trajetória profissional</caption>
        <tr>
            <th rowspan="2" >Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de conclusão</th>
        </tr>
        <tr>
            <th>Graduação</th>
            <th>Pós-Graduação</th>
        </tr>
        <tr>
            <th>José</td>
            <td>Ciência da Computação</td>
            <td>Inteligencia Artificial</td>
            <td>2023</td>
        </tr>
        <tr>
            <th>Ana</td>
            <td>Engenharia de Software</td>
            <td>Gestão de projetos</td>
            <td>2022</td>
        </tr>
    </table>
</body>
</html>
